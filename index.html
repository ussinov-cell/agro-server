<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGRO-CONTROL v6.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        .active-tab { border-bottom: 4px solid #10b981; color: #10b981; font-weight: 900; }
        .notif-anim { animation: slideDown 0.5s ease-out; }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        input, select { outline: none; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <div id="notif-container" class="fixed top-0 left-0 right-0 z-[1000] p-4 pointer-events-none space-y-2"></div>

    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-[3rem] shadow-2xl w-full max-w-sm border border-slate-100">
            
            <div id="login-form">
                <h1 class="text-3xl font-black text-emerald-600 mb-8 text-center uppercase tracking-tighter text-emerald-600">Вход</h1>
                <input id="l-id" placeholder="ID (Логин)" class="w-full p-5 mb-3 bg-slate-50 border rounded-3xl font-bold">
                <input id="l-pass" type="password" placeholder="Пароль" class="w-full p-5 mb-6 bg-slate-50 border rounded-3xl font-bold">
                <button onclick="login()" class="w-full bg-emerald-600 text-white font-black p-5 rounded-3xl shadow-lg uppercase mb-4">Войти</button>
                <button onclick="toggleAuth(false)" class="w-full text-slate-400 font-bold text-[10px] uppercase">Нет аккаунта? Регистрация</button>
            </div>

            <div id="reg-form" class="hidden">
                <h1 class="text-3xl font-black text-blue-600 mb-6 text-center uppercase tracking-tighter">Регистрация</h1>
                <div class="space-y-3 mb-6">
                    <input id="r-name" placeholder="ФИО" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold">
                    <input id="r-phone" type="tel" placeholder="Номер телефона (8707...)" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold">
                    <select id="r-role" class="w-full p-4 bg-blue-50 border-2 border-blue-100 rounded-2xl font-black text-blue-600 uppercase text-xs">
                        <option value="worker">Я — Админ участка</option>
                        <option value="owner">Я — Владелец (Boss)</option>
                    </select>
                    <div class="grid grid-cols-2 gap-2">
                        <input id="r-id" placeholder="Логин (ID)" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold">
                        <input id="r-pass" type="password" placeholder="Пароль" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold">
                    </div>
                </div>
                <button onclick="register()" class="w-full bg-blue-600 text-white font-black p-5 rounded-3xl shadow-lg uppercase mb-4">Создать аккаунт</button>
                <button onclick="toggleAuth(true)" class="w-full text-slate-400 font-bold text-[10px] uppercase">Назад ко входу</button>
            </div>
        </div>
    </div>

    <div id="app" class="hidden pb-20">
        <header class="bg-white p-5 shadow-sm flex justify-between items-center sticky top-0 z-50">
            <div>
                <p id="u-name" class="font-black text-lg uppercase"></p>
                <p id="u-role" class="text-[9px] font-bold text-slate-300 uppercase tracking-widest"></p>
            </div>
            <button onclick="logout()" class="text-[10px] font-black text-red-400 border border-red-50 p-2 rounded-xl">ВЫХОД</button>
        </header>

        <nav id="nav-owner" class="hidden grid grid-cols-4 bg-white border-b text-[9px] font-black uppercase sticky top-[76px] z-40">
            <button onclick="tab('b-fields', this)" class="p-4 tab-btn active-tab">Поля</button>
            <button onclick="tab('b-reports', this)" class="p-4 tab-btn">Отчеты</button>
            <button onclick="tab('b-scales', this)" class="p-4 tab-btn">Весы</button>
            <button onclick="tab('b-stock', this)" class="p-4 tab-btn">Склад</button>
        </nav>

        <nav id="nav-worker" class="hidden grid grid-cols-3 bg-white border-b text-[9px] font-black uppercase sticky top-[76px] z-40">
            <button onclick="tab('w-jobs', this)" class="p-4 tab-btn active-tab">Задачи</button>
            <button onclick="tab('w-truck', this)" class="p-4 tab-btn">Уборка</button>
            <button onclick="tab('w-stats', this)" class="p-4 tab-btn">Инфо</button>
        </nav>

        <main class="p-4 max-w-lg mx-auto">
            <div id="b-fields" class="tab-pane space-y-4">
                <button onclick="openFieldModal()" class="w-full bg-slate-900 text-white p-5 rounded-[2rem] font-black uppercase text-xs shadow-xl">+ Добавить участок</button>
                <div id="boss-list" class="space-y-3"></div>
            </div>

            <div id="b-reports" class="tab-pane hidden space-y-3">
                <div class="bg-white rounded-3xl shadow-sm overflow-hidden text-[10px]">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 font-black uppercase">
                            <tr><th class="p-3">Работа</th><th class="p-3">Техника</th><th class="p-3">Итого</th><th class="p-3 text-emerald-600">₸/Га</th></tr>
                        </thead>
                        <tbody id="reports-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="w-jobs" class="tab-pane space-y-4"></div>

            <div id="b-scales" class="tab-pane hidden">
                <div id="scales-ui" class="bg-white p-10 rounded-[3rem] shadow-xl text-center border-4 border-dashed border-slate-100"></div>
            </div>

            <div id="b-stock" class="tab-pane hidden space-y-4">
                <div class="bg-white p-8 rounded-[2.5rem] shadow-sm">
                    <p class="text-[10px] font-black text-slate-300 uppercase">Остаток ГСМ на складе</p>
                    <p id="fuel-val" class="text-5xl font-black text-emerald-600">0 л</p>
                </div>
                <input id="f-add" type="number" placeholder="Сколько литров привезли?" class="w-full p-5 border rounded-3xl font-bold">
                <button onclick="addFuel()" class="w-full bg-emerald-600 text-white p-5 rounded-3xl font-black uppercase shadow-lg">Пополнить склад</button>
            </div>

            <div id="w-stats" class="tab-pane hidden space-y-4">
                <div id="worker-stats-card" class="bg-white p-8 rounded-[2.5rem] shadow-sm"></div>
            </div>

            <div id="w-truck" class="tab-pane hidden text-center py-12">
                <button onclick="openTruckModal()" class="bg-emerald-600 text-white p-16 rounded-full font-black uppercase shadow-2xl border-[12px] border-white">Отправить<br>на весы</button>
            </div>
        </main>
    </div>

    <div id="finish-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-[1000] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 shadow-2xl">
            <h3 id="finish-title" class="text-xl font-black mb-6 uppercase text-emerald-600 text-center">Завершение этапа</h3>
            <div class="space-y-3">
                <div><label class="text-[9px] font-bold text-slate-400 ml-2 uppercase">Потрачено ГСМ (л)</label>
                    <input id="in-fuel" type="number" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold"></div>
                <div><label class="text-[9px] font-bold text-slate-400 ml-2 uppercase">На технику / запчасти (₸)</label>
                    <input id="in-tech" type="number" class="w-full p-4 bg-blue-50 border border-blue-100 rounded-2xl font-bold text-blue-600"></div>
                <div><label class="text-[9px] font-bold text-slate-400 ml-2 uppercase">Прочие расходы (₸)</label>
                    <input id="in-money" type="number" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold"></div>
                <div id="seed-box" class="hidden"><label class="text-[9px] font-bold text-slate-400 ml-2 text-emerald-600 uppercase">Семена (кг)</label>
                    <input id="in-seeds" type="number" class="w-full p-4 bg-emerald-50 border border-emerald-100 rounded-2xl font-bold"></div>
                <input id="in-comment" placeholder="Комментарий (на что ушли деньги?)" class="w-full p-4 border rounded-2xl">
            </div>
            <button onclick="submitFinish()" class="w-full bg-emerald-600 text-white p-5 rounded-3xl font-black uppercase mt-8 shadow-lg">Сохранить и отправить</button>
            <button onclick="closeModals()" class="w-full mt-2 text-slate-300 font-bold p-2 text-[10px] uppercase text-center">Отмена</button>
        </div>
    </div>

    <div id="field-modal" class="hidden fixed inset-0 bg-black/80 z-[1000] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 shadow-2xl">
            <h3 class="text-xl font-black mb-6 uppercase text-center">Новое поле</h3>
            <input id="fn-name" placeholder="Название участка (напр. Поле №1)" class="w-full p-4 mb-2 border rounded-2xl">
            <input id="fn-area" type="number" placeholder="Площадь в Гектарах" class="w-full p-4 mb-2 border rounded-2xl font-bold">
            <label class="text-[9px] font-bold text-slate-400 ml-2">ВЫБЕРИТЕ АДМИНА</label>
            <select id="fn-worker" class="w-full p-4 mb-8 bg-slate-50 border rounded-2xl font-bold"></select>
            <button onclick="saveField()" class="w-full bg-emerald-600 text-white p-5 rounded-3xl font-black uppercase shadow-lg">Создать</button>
            <button onclick="closeModals()" class="w-full mt-2 text-slate-400 font-bold p-2 text-[10px] uppercase text-center">Закрыть</button>
        </div>
    </div>

    <div id="truck-modal" class="hidden fixed inset-0 bg-black/80 z-[1000] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8">
            <h3 class="text-xl font-black mb-6 uppercase text-center text-emerald-600">Отправка зерна</h3>
            <input id="t-model" placeholder="Марка (напр. КАМАЗ)" class="w-full p-4 mb-2 border rounded-2xl uppercase font-bold">
            <input id="t-plate" placeholder="ГОС НОМЕР" class="w-full p-4 mb-6 border rounded-2xl text-center text-2xl font-black uppercase tracking-widest">
            <button onclick="sendTruck()" class="w-full bg-emerald-600 text-white p-5 rounded-3xl font-black uppercase shadow-lg">В ПУТЬ!</button>
            <button onclick="closeModals()" class="w-full mt-2 text-slate-400 font-bold p-2 text-[10px] uppercase text-center">Отмена</button>
        </div>
    </div>

    <script>
        const API = 'https://agro-server-nuwi.onrender.com'; // ЗАМЕНИ НА СВОЙ АДРЕС RENDER
        let user = JSON.parse(localStorage.getItem('agro_u'));
        let lastLogsCount = 0;
        let activeJob = null;

        function toggleAuth(isLogin) {
            document.getElementById('login-form').classList.toggle('hidden', !isLogin);
            document.getElementById('reg-form').classList.toggle('hidden', isLogin);
        }

        async function register() {
            const payload = {
                name: document.getElementById('r-name').value,
                phone: document.getElementById('r-phone').value,
                role: document.getElementById('r-role').value,
                id: document.getElementById('r-id').value,
                pass: document.getElementById('r-pass').value
            };
            if(!payload.id || !payload.pass || !payload.name) return alert("Заполни всё!");

            const res = await fetch(`${API}/api/register`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if(res.ok) { alert("Успех! Теперь войдите."); toggleAuth(true); } else alert("Ошибка!");
        }

        async function login() {
            const id = document.getElementById('l-id').value;
            const pass = document.getElementById('l-pass').value;
            const res = await fetch(`${API}/api/state`);
            const data = await res.json();
            const found = data.users.find(u => u.id === id && u.pass === pass);
            if(found) {
                user = found;
                localStorage.setItem('agro_u', JSON.stringify(found));
                startApp();
            } else alert("Неверный логин или пароль!");
        }

        function logout() { localStorage.removeItem('agro_u'); location.reload(); }

        function startApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('u-name').innerText = user.name;
            document.getElementById('u-role').innerText = user.role === 'owner' ? 'Глава хозяйства (Boss)' : 'Администратор участка';
            
            if(user.role === 'owner') document.getElementById('nav-owner').classList.remove('hidden');
            else document.getElementById('nav-worker').classList.remove('hidden');
            
            refresh();
            setInterval(refresh, 5000);
        }

        async function refresh() {
            try {
                const res = await fetch(`${API}/api/state`);
                const data = await res.json();
                if(user.role === 'owner') renderBoss(data); else renderWorker(data);
                handleLogs(data.logs);
            } catch(e) { console.log("Сервер не отвечает"); }
        }

        function renderBoss(data) {
            // Поля
            document.getElementById('boss-list').innerHTML = data.fields.map(f => `
                <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border-l-[12px] ${f.stage==='Завершено'?'border-emerald-500':'border-orange-400'}">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-[9px] font-black text-slate-300 uppercase">${f.area} Га</p>
                            <h3 class="font-black text-xl leading-tight">${f.name}</h3>
                            <p class="text-[10px] font-bold text-emerald-600 uppercase">Админ: ${f.assignedTo}</p>
                        </div>
                        <span class="bg-slate-50 px-3 py-1 rounded-full text-[9px] font-black uppercase text-slate-500">${f.stage}</span>
                    </div>
                </div>
            `).join('');

            // Отчеты
            document.getElementById('reports-body').innerHTML = data.reports.map(r => `
                <tr class="border-b">
                    <td class="p-3"><b>${r.work}</b><br><span class="text-slate-400">${r.field}</span></td>
                    <td class="p-3 text-blue-600 font-bold">${r.techCost} ₸</td>
                    <td class="p-3">${r.totalCost} ₸</td>
                    <td class="p-3 font-black text-emerald-600 text-right">${r.perHa} ₸</td>
                </tr>
            `).join('');

            // Весовая
            const sc = document.getElementById('scales-ui');
            if (data.truckInWay) {
                sc.innerHTML = `
                    <p class="text-[10px] font-black text-emerald-600 uppercase mb-2">Груз прибыл</p>
                    <h2 class="text-3xl font-black mb-1">${data.truckInWay.model}</h2>
                    <p class="text-slate-400 font-bold mb-8 uppercase tracking-widest">${data.truckInWay.plate}</p>
                    <input id="netto" type="number" placeholder="ЧИСТЫЙ ВЕС (КГ)" class="w-full p-6 bg-slate-50 rounded-3xl text-center text-3xl font-black mb-4 border-2 border-emerald-100">
                    <button onclick="acceptWeight()" class="w-full bg-emerald-600 text-white p-5 rounded-3xl font-black uppercase shadow-lg">Подтвердить вес</button>
                `;
            } else sc.innerHTML = `<p class="py-6 text-slate-300 font-black uppercase italic text-xs">Машин в пути нет</p>`;

            document.getElementById('fuel-val').innerText = data.fuel + ' л';
        }

        function renderWorker(data) {
            const my = data.fields.filter(f => f.assignedTo === user.id);
            document.getElementById('w-jobs').innerHTML = my.map(f => `
                <div class="bg-white p-8 rounded-[3rem] shadow-sm border-l-[16px] border-orange-400">
                    <p class="text-[9px] font-black text-slate-300 uppercase tracking-tighter mb-1">${f.area} Га</p>
                    <h3 class="font-black text-2xl mb-6">${f.name}</h3>
                    ${getBtn(f)}
                </div>
            `).join('');

            const stat = data.workers[user.id] || {bonus:0, fuelSpent:0, totalBrought:0};
            document.getElementById('worker-stats-card').innerHTML = `
                <div class="space-y-4">
                    <div class="flex justify-between items-center"><span class="text-[10px] font-black text-slate-300 uppercase">Премия</span><span class="text-3xl font-black text-emerald-600">${stat.bonus} ₸</span></div>
                    <div class="flex justify-between items-center"><span class="text-[10px] font-black text-slate-300 uppercase">ГСМ расход</span><span class="font-bold text-red-400">-${stat.fuelSpent} л</span></div>
                    <div class="flex justify-between items-center"><span class="text-[10px] font-black text-slate-300 uppercase">Сдано веса</span><span class="font-bold text-blue-500">${stat.totalBrought} кг</span></div>
                </div>
            `;
        }

        function getBtn(f) {
            if(f.stage === 'Ожидание') return `<button onclick="setStatus(${f.id}, 'Пахота')" class="w-full bg-orange-400 text-white p-4 rounded-2xl font-black uppercase text-xs shadow-md">Начать пахоту</button>`;
            if(f.stage === 'Пахота') return `<button onclick="openFinish(${f.id}, 'Пахота', 'Боронование')" class="w-full bg-slate-800 text-white p-4 rounded-2xl font-black uppercase text-xs">Завершить пахоту</button>`;
            if(f.stage === 'Боронование') return `<button onclick="openFinish(${f.id}, 'Боронование', 'Посев')" class="w-full bg-slate-800 text-white p-4 rounded-2xl font-black uppercase text-xs">Завершить бороны</button>`;
            if(f.stage === 'Посев') return `<button onclick="openFinish(${f.id}, 'Посев', 'Завершено')" class="w-full bg-emerald-600 text-white p-4 rounded-2xl font-black uppercase text-xs shadow-md">Завершить посев</button>`;
            return `<div class="bg-emerald-50 text-emerald-600 p-4 rounded-2xl text-center font-black uppercase text-[10px]">Все этапы завершены</div>`;
        }

        // МОДАЛКИ И ЛОГИКА
        function openFinish(id, stage, next) {
            activeJob = { id, stage, next };
            document.getElementById('finish-title').innerText = stage.toUpperCase();
            document.getElementById('seed-box').classList.toggle('hidden', stage !== 'Посев');
            document.getElementById('finish-modal').classList.remove('hidden');
        }

        async function submitFinish() {
            const p = { 
                fieldId: activeJob.id, stageName: activeJob.stage, nextStage: activeJob.next,
                fuel: document.getElementById('in-fuel').value,
                money: document.getElementById('in-money').value,
                techMoney: document.getElementById('in-tech').value,
                comment: document.getElementById('in-comment').value,
                seeds: document.getElementById('in-seeds').value
            };
            await fetch(`${API}/api/finish-stage`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(p) });
            closeModals(); refresh();
        }

        async function setStatus(fieldId, newStage) {
            await fetch(`${API}/api/field-status`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({fieldId, newStage}) });
            refresh();
        }

        async function acceptWeight() {
            const w = document.getElementById('netto').value;
            await fetch(`${API}/api/accept-weight`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({weight:w}) });
            refresh();
        }

        async function addFuel() {
            const a = document.getElementById('f-add').value;
            await fetch(`${API}/api/stock-up`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({amount:a}) });
            document.getElementById('f-add').value = ''; refresh();
        }

        async function sendTruck() {
            const p = { model: document.getElementById('t-model').value, plate: document.getElementById('t-plate').value, workerId: user.id };
            await fetch(`${API}/api/send-truck`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(p) });
            closeModals(); refresh();
        }

        async function openFieldModal() {
            document.getElementById('field-modal').classList.remove('hidden');
            const res = await fetch(`${API}/api/state`);
            const data = await res.json();
            document.getElementById('fn-worker').innerHTML = data.users.filter(u => u.role === 'worker').map(w => `<option value="${w.id}">${w.name} (${w.id})</option>`).join('');
        }

        async function saveField() {
            const p = { name: document.getElementById('fn-name').value, area: document.getElementById('fn-area').value, workerId: document.getElementById('fn-worker').value };
            await fetch(`${API}/api/assign-field`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(p) });
            closeModals(); refresh();
        }

        function handleLogs(logs) {
            if(logs.length > lastLogsCount) {
                const last = logs[logs.length - 1];
                if(!last.target || last.target === user.id) showNotif(last.text);
                lastLogsCount = logs.length;
            }
        }

        function showNotif(txt) {
            const container = document.getElementById('notif-container');
            const d = document.createElement('div');
            d.className = "bg-slate-900 text-white p-4 rounded-2xl shadow-2xl notif-anim font-black text-[10px] uppercase text-center pointer-events-auto border-l-4 border-emerald-500";
            d.innerText = txt;
            container.appendChild(d);
            setTimeout(() => d.remove(), 5000);
        }

        function tab(id, btn) {
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab'));
            btn.classList.add('active-tab');
        }

        function closeModals() { document.querySelectorAll('#finish-modal, #field-modal, #truck-modal').forEach(m => m.classList.add('hidden')); }
        function openTruckModal() { document.getElementById('truck-modal').classList.remove('hidden'); }

        // Проверка входа при загрузке
        if(user) startApp();
    </script>
</body>
</html>
