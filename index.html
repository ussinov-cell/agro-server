<body class="bg-[#F8FAFC]">

    <div id="header" class="hidden bg-white p-4 shadow-sm flex justify-between items-center mb-4">
        <span class="font-black text-emerald-600 uppercase tracking-tighter">Агро-Контроль</span>
        <button onclick="logout()" class="text-xs font-bold text-red-500 border border-red-200 px-3 py-1 rounded-lg">ВЫЙТИ</button>
    </div>

    <div id="login-screen" class="flex items-center justify-center min-h-screen p-6">
        <div class="bg-white p-8 rounded-[2.5rem] card-shadow w-full max-w-[400px]">
            <h1 class="text-center font-black mb-8">ВХОД В СИСТЕМУ</h1>
            <input id="login-id" type="text" placeholder="Логин (Boss или M1)" class="w-full p-4 mb-4 bg-gray-50 rounded-2xl border">
            <input id="login-pass" type="password" placeholder="Пароль" class="w-full p-4 mb-8 bg-gray-50 rounded-2xl border">
            <button onclick="login()" class="w-full bg-emerald-600 text-white p-4 rounded-2xl font-bold uppercase">Войти</button>
        </div>
    </div>

    <div id="owner-screen" class="hidden p-4 max-w-lg mx-auto">
        <div class="bg-white p-6 rounded-[2rem] card-shadow mb-6">
            <h3 class="font-bold text-xs uppercase mb-4 text-gray-400">🆕 Добавить участок</h3>
            <div class="space-y-3">
                <input id="new-field-name" placeholder="Название (Участок №1)" class="w-full p-3 bg-gray-50 rounded-xl border">
                <input id="new-field-culture" placeholder="Культура (Свекла)" class="w-full p-3 bg-gray-50 rounded-xl border">
                <select id="new-field-worker" class="w-full p-3 bg-gray-50 rounded-xl border">
                    <option value="M1">Алексей (M1)</option>
                    <option value="M2">Иван (M2)</option>
                </select>
                <button onclick="addField()" class="w-full bg-purple-600 text-white p-3 rounded-xl font-bold uppercase text-xs">Закрепить исполнителя</button>
            </div>
        </div>

        <div id="fields-status" class="space-y-4">
            </div>
    </div>

    <script>
        // Логика авторизации
        const users = {
            'Boss': { pass: '12345', role: 'owner' },
            'M1': { pass: '5555', role: 'worker' }
        };

        function login() {
            const id = document.getElementById('login-id').value;
            const pass = document.getElementById('login-pass').value;

            if (users[id] && users[id].pass === pass) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('header').classList.remove('hidden');
                
                if (users[id].role === 'owner') {
                    document.getElementById('owner-screen').classList.remove('hidden');
                } else {
                    document.getElementById('worker-screen').classList.remove('hidden');
                }
            } else {
                alert("Неверный логин или пароль!");
            }
        }

        function logout() {
            location.reload(); // Самый быстрый способ сбросить сессию
        }

        async function addField() {
            const name = document.getElementById('new-field-name').value;
            const culture = document.getElementById('new-field-culture').value;
            const workerId = document.getElementById('new-field-worker').value;

            // Отправляем на сервер
            await fetch(`${API_URL}/api/add-field`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, culture, workerId })
            });
            alert("Участок закреплен!");
            refreshData();
        }
    </script>
</body>
