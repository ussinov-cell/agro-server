<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АГРО-УПРАВЛЕНИЕ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        .alert-card { animation: slideIn 0.4s ease-out; cursor: pointer; pointer-events: auto; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .active-tab { border-bottom: 4px solid #059669; color: #059669; font-weight: 900; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20">

    <div id="notif-area" class="fixed top-20 right-4 left-4 z-[300] space-y-3 pointer-events-none"></div>

    <div class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-50">
        <span class="font-black text-emerald-600 tracking-tighter">AGRO-BOSS</span>
        <button onclick="logout()" class="text-[10px] bg-red-50 text-red-500 px-3 py-1 rounded-lg">ВЫХОД</button>
    </div>

    <div id="owner-tabs" class="hidden grid grid-cols-4 bg-white border-b sticky top-[56px] z-40">
        <button onclick="switchTab('owner-main')" id="btn-main" class="p-4 text-[10px] uppercase">Поля</button>
        <button onclick="switchTab('owner-scales')" id="btn-scales" class="p-4 text-[10px] uppercase">Весовая</button>
        <button onclick="switchTab('owner-stock')" id="btn-stock" class="p-4 text-[10px] uppercase">Склад</button>
        <button onclick="switchTab('owner-reports')" id="btn-reports" class="p-4 text-[10px] uppercase">Отчеты</button>
    </div>

    <div id="app-content" class="p-4 max-w-lg mx-auto">
        
        <div id="owner-main" class="tab-content hidden space-y-4">
            <h2 class="font-black text-xs uppercase text-slate-400">Мониторинг участков</h2>
            <div id="fields-list" class="space-y-3">
                </div>
        </div>

        <div id="owner-scales" class="tab-content hidden">
            <div id="scales-card" class="bg-white p-8 rounded-[2rem] shadow-xl text-center">
                <p class="text-slate-300 font-bold uppercase text-xs italic">Ожидание машин...</p>
            </div>
        </div>

        </div>

    <script>
        const API_URL = 'https://agro-server-nuwi.onrender.com';
        let currentUser = localStorage.getItem('agro_user') || 'Boss'; 
        let lastTruckStatus = null;
        let lastAcceptedId = null;

        async function refresh() {
            const res = await fetch(`${API_URL}/api/state`);
            const data = await res.json();

            // 1. Уведомление для BOSS: Машина в пути
            if (currentUser === 'Boss' && data.truckInWay && lastTruckStatus !== data.truckInWay.plate) {
                createAlert(`🚛 ЕДЕТ МАШИНА: ${data.truckInWay.model}. Нажми, чтобы принять!`, () => switchTab('owner-scales'));
                lastTruckStatus = data.truckInWay.plate;
            }

            // 2. Уведомление для BOSS: Мало ГСМ
            if (currentUser === 'Boss' && data.fuel < 200) {
                createAlert(`⚠️ КРИТИЧЕСКИЙ ОСТАТОК ГСМ: ${data.fuel}л! Пополни склад.`, () => switchTab('owner-stock'), 'bg-orange-600');
            }

            // 3. Уведомление для АДМИНА: Вес принят
            if (currentUser !== 'Boss' && data.lastAcceptedTruck && data.lastAcceptedTruck.time !== lastAcceptedId) {
                if (data.lastAcceptedTruck.workerId === currentUser) {
                    createAlert(`✅ ВЕС ПРИНЯТ: ${data.lastAcceptedTruck.weight}кг засчитано в премию!`, null, 'bg-emerald-600');
                    lastAcceptedId = data.lastAcceptedTruck.time;
                }
            }

            renderFields(data.fields);
            renderScales(data.truckInWay);
        }

        function createAlert(text, action, color = 'bg-blue-600') {
            const area = document.getElementById('notif-area');
            const el = document.createElement('div');
            el.className = `${color} text-white p-4 rounded-2xl shadow-2xl alert-card flex justify-between items-center`;
            el.innerHTML = `<span class="text-[11px] font-black uppercase">${text}</span>`;
            if (action) el.onclick = () => { action(); el.remove(); };
            else el.onclick = () => el.remove();
            area.appendChild(el);
            setTimeout(() => el.remove(), 10000);
        }

        function renderFields(fields) {
            const list = document.getElementById('fields-list');
            if(!list) return;
            list.innerHTML = fields.map(f => `
                <div class="bg-white p-5 rounded-3xl shadow-sm border-l-4 border-emerald-500">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-black text-lg">${f.name} <span class="text-[10px] text-slate-400">(${f.area})</span></h4>
                            <p class="text-xs font-bold text-emerald-600 uppercase">${f.culture}</p>
                        </div>
                        <span class="bg-slate-100 px-3 py-1 rounded-full text-[10px] font-black uppercase text-slate-500">${f.stage}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderScales(truck) {
            const card = document.getElementById('scales-card');
            if(!card) return;
            if(truck) {
                card.innerHTML = `
                    <h3 class="font-black text-blue-600 mb-4 uppercase text-xs tracking-widest">Приемка урожая</h3>
                    <p class="text-2xl font-black mb-1">${truck.model}</p>
                    <p class="text-slate-400 font-bold mb-6">${truck.plate}</p>
                    <input id="netto" type="number" placeholder="Чистый вес (кг)" class="w-full p-4 bg-slate-50 rounded-2xl mb-4 text-center font-black text-xl border-2 border-blue-100">
                    <button onclick="confirmWeight()" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase shadow-lg shadow-blue-100">Зафиксировать вес</button>
                `;
            } else {
                card.innerHTML = `<p class="text-slate-300 font-bold uppercase text-xs italic py-10">Машин в пути нет</p>`;
            }
        }

        async function confirmWeight() {
            const w = document.getElementById('netto').value;
            await fetch(`${API_URL}/api/accept-weight`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ weight: w })
            });
            refresh();
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('#owner-tabs button').forEach(b => b.classList.remove('active-tab'));
            document.getElementById(id).classList.remove('hidden');
            document.getElementById('btn-' + id.split('-')[1]).classList.add('active-tab');
        }

        setInterval(refresh, 4000);
        window.onload = () => { if(currentUser === 'Boss') document.getElementById('owner-tabs').classList.remove('hidden'); switchTab('owner-main'); refresh(); };
    </script>
</body>
</html>
