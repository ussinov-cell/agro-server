<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АГРО-КОНТРОЛЬ: ОТЧЕТНОСТЬ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        .card-shadow { box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1); }
        .active-tab { border-bottom: 4px solid #059669; color: #059669; background: #f0fdf4; }
        .alert-pop { animation: slideIn 0.5s ease-out; }
        @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-[#F8FAFC] text-[#1E293B] min-h-screen">

    <div id="notification-zone" class="fixed top-4 left-4 right-4 z-[200] space-y-2 pointer-events-none"></div>

    <div id="app-header" class="hidden bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-50">
        <div class="flex flex-col">
            <span class="font-black text-emerald-600 text-xs uppercase tracking-widest">Агро-Система</span>
            <span id="user-info" class="text-[9px] font-bold text-gray-400 uppercase"></span>
        </div>
        <button onclick="logout()" class="text-[10px] font-black text-red-400 border border-red-100 px-3 py-1.5 rounded-xl">ВЫЙТИ</button>
    </div>

    <div id="login-screen" class="flex items-center justify-center min-h-screen p-6">
        <div class="bg-white p-10 rounded-[3rem] card-shadow w-full max-w-[400px] border border-gray-50 text-center">
            <h1 class="font-black text-2xl mb-10 text-emerald-600">ВХОД</h1>
            <input id="login-id" type="text" placeholder="Логин" class="w-full p-5 mb-4 bg-gray-50 border rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500">
            <input id="login-pass" type="password" placeholder="Пароль" class="w-full p-5 mb-8 bg-gray-50 border rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500">
            <button onclick="login()" class="w-full bg-emerald-600 text-white font-black p-5 rounded-2xl tracking-widest uppercase shadow-xl">Войти</button>
        </div>
    </div>

    <div id="owner-tabs" class="hidden grid grid-cols-4 gap-1 px-2 mt-4 max-w-lg mx-auto">
        <button id="tab-main" onclick="switchTab('owner-main')" class="active-tab p-3 rounded-xl text-[9px] font-black">ГЛАВНАЯ</button>
        <button id="tab-scales" onclick="switchTab('owner-scales')" class="bg-white p-3 rounded-xl text-[9px] font-black shadow-sm">ВЕСОВАЯ</button>
        <button id="tab-stock" onclick="switchTab('owner-stock')" class="bg-white p-3 rounded-xl text-[9px] font-black shadow-sm">СКЛАД</button>
        <button id="tab-reports" onclick="switchTab('owner-reports')" class="bg-white p-3 rounded-xl text-[9px] font-black shadow-sm text-purple-600">ОТЧЕТЫ</button>
    </div>

    <div id="owner-reports" class="tab-content hidden p-4 max-w-lg mx-auto space-y-4">
        <div class="bg-white rounded-[2rem] card-shadow p-6">
            <h2 class="font-black text-xs uppercase mb-6 tracking-widest text-purple-600">📊 Сводный отчет</h2>
            <div class="overflow-hidden rounded-2xl border">
                <table class="w-full text-left text-[10px]">
                    <thead class="bg-slate-50 border-b">
                        <tr>
                            <th class="p-3">Админ</th>
                            <th class="p-3">ГСМ (л)</th>
                            <th class="p-3">Урожай (кг)</th>
                            <th class="p-3">Тенге</th>
                        </tr>
                    </thead>
                    <tbody id="boss-report-table">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="worker-tabs" class="hidden grid grid-cols-3 gap-1 px-2 mt-4 max-w-lg mx-auto">
        <button id="tab-w-main" onclick="switchWorkerTab('worker-main')" class="active-tab p-3 rounded-xl text-[9px] font-black">РАСХОДЫ</button>
        <button id="tab-w-harvest" onclick="switchWorkerTab('worker-harvest')" class="bg-white p-3 rounded-xl text-[9px] font-black shadow-sm text-emerald-600">УБОРКА</button>
        <button id="tab-w-reports" onclick="switchWorkerTab('worker-reports')" class="bg-white p-3 rounded-xl text-[9px] font-black shadow-sm text-blue-600">МОИ ОТЧЕТЫ</button>
    </div>

    <div id="worker-reports" class="worker-tab-content hidden p-4 max-w-lg mx-auto">
        <div class="bg-white rounded-[2rem] card-shadow p-6">
            <h2 class="font-black text-xs uppercase mb-6 tracking-widest text-blue-600">📝 Моя история</h2>
            <div id="worker-history-list" class="space-y-3">
                </div>
        </div>
    </div>

    <div id="owner-main" class="tab-content hidden p-4 max-w-lg mx-auto"> </div>
    <div id="owner-scales" class="tab-content hidden p-4 max-w-lg mx-auto"> </div>
    <div id="owner-stock" class="tab-content hidden p-4 max-w-lg mx-auto"> </div>
    <div id="worker-main" class="worker-tab-content hidden p-4 max-w-lg mx-auto"> </div>
    <div id="worker-harvest" class="worker-tab-content hidden p-4 max-w-lg mx-auto"> </div>

    <div id="truck-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-6 z-[100]">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-10 card-shadow">
            <h3 class="font-black text-[10px] mb-8 uppercase text-center tracking-widest text-gray-400">Данные машины</h3>
            <input id="t-model" placeholder="Марка" class="w-full p-5 bg-gray-50 border rounded-2xl mb-4 font-bold outline-none">
            <input id="t-plate" placeholder="Гос. Номер" class="w-full p-5 bg-gray-50 border rounded-2xl mb-8 outline-none text-center font-black text-2xl uppercase">
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 p-5 bg-gray-100 rounded-2xl font-black text-[10px] uppercase">Отмена</button>
                <button onclick="confirmSendTruck()" class="flex-1 p-5 bg-emerald-600 text-white rounded-2xl font-black text-[10px] uppercase">ОТПРАВИТЬ</button>
            </div>
        </div>
    </div>

   <script>
    const API_URL = 'https://agro-server-nuwi.onrender.com';
    let currentUser = localStorage.getItem('agro_user') || '';
    let lastKnownState = null;

    const users = {
        'Boss': { pass: '12345', role: 'owner', name: 'Владелец' },
        'M1': { pass: '5555', role: 'worker', name: 'Алексей (M1)' },
        'M2': { pass: '6666', role: 'worker', name: 'Иван (M2)' }
    };

    // ФУНКЦИЯ ВХОДА (ИСПРАВЛЕНА)
    function login() {
        const id = document.getElementById('login-id').value;
        const pass = document.getElementById('login-pass').value;

        if (users[id] && users[id].pass === pass) {
            currentUser = id;
            localStorage.setItem('agro_user', id);
            initApp(); // Запускаем приложение
        } else {
            alert("Неверный логин или пароль!");
        }
    }

    function logout() {
        localStorage.removeItem('agro_user');
        location.reload();
    }

    // ИНИЦИАЛИЗАЦИЯ ЭКРАНОВ
    function initApp() {
        if (!currentUser) return;
        
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-header').classList.remove('hidden');
        document.getElementById('user-info').innerText = users[currentUser].name;

        if (users[currentUser].role === 'owner') {
            document.getElementById('owner-tabs').classList.remove('hidden');
            switchTab('owner-main');
        } else {
            document.getElementById('worker-tabs').classList.remove('hidden');
            switchWorkerTab('worker-main');
        }
        refreshData();
    }

    // УВЕДОМЛЕНИЯ
    function showNotification(text, type = 'info') {
        const zone = document.getElementById('notification-zone');
        const color = type === 'truck' ? 'bg-blue-600' : 'bg-emerald-600';
        const el = document.createElement('div');
        el.className = `alert-pop pointer-events-auto ${color} text-white p-4 rounded-2xl shadow-2xl flex items-center gap-3 border-2 border-white/20 mb-2`;
        el.innerHTML = `<span class="text-xl">${type === 'truck' ? '🚛' : '💰'}</span><p class="text-[11px] font-bold leading-tight">${text}</p>`;
        zone.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 500); }, 8000);
    }

    // ОБНОВЛЕНИЕ ДАННЫХ
    async function refreshData() {
        try {
            const res = await fetch(`${API_URL}/api/state`);
            if (!res.ok) throw new Error('Ошибка сети');
            const data = await res.json();

            // Проверка уведомлений для Boss
            if (currentUser === 'Boss' && lastKnownState) {
                if (data.truckInWay && (!lastKnownState.truckInWay || lastKnownState.truckInWay.plate !== data.truckInWay.plate)) {
                    showNotification(`МАШИНА В ПУТИ: ${data.truckInWay.model} (${data.truckInWay.plate}).`, 'truck');
                }
            }
            lastKnownState = data;

            // Обновление цифр ГСМ и Урожая
            if(document.getElementById('fuel-display')) {
                document.getElementById('fuel-display').innerText = (data.fuel || 0).toLocaleString() + ' л';
                document.getElementById('weight-display').innerText = (data.totalWeight || 0).toLocaleString() + ' кг';
            }

            // Обновление Весовой
            const list = document.getElementById('transit-list');
            if(list) {
                if(data.truckInWay) {
                    list.innerHTML = `
                        <div class="bg-blue-50 border-2 border-blue-100 p-6 rounded-[2.5rem] text-left">
                            <p class="font-black text-blue-900 text-xl">${data.truckInWay.model}</p>
                            <p class="font-bold text-blue-600 text-sm mb-6">${data.truckInWay.plate}</p>
                            <input id="weight-input" type="number" placeholder="Вес (кг)" class="w-full p-4 border rounded-2xl mb-4 font-black">
                            <button onclick="acceptWeight()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-black text-[10px] uppercase">Принять</button>
                        </div>
                    `;
                } else {
                    list.innerHTML = `<div class="py-10 text-gray-300 font-bold uppercase italic">Машин нет</div>`;
                }
            }

            // Обновление отчетов
            const reportTable = document.getElementById('boss-report-table');
            if (reportTable && data.workers) {
                reportTable.innerHTML = Object.entries(data.workers).map(([id, w]) => `
                    <tr class="border-b">
                        <td class="p-3 font-bold">${w.name}</td>
                        <td class="p-3 text-red-500">-${w.fuelSpent || 0}</td>
                        <td class="p-3 text-blue-600">${w.totalBrought || 0}</td>
                        <td class="p-3 font-bold text-emerald-600">${(w.bonus || 0).toLocaleString()} ₸</td>
                    </tr>
                `).join('');
            }
        } catch(e) { console.error("Ошибка связи:", e); }
    }

    // Переключение вкладок (Boss)
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.querySelectorAll('#owner-tabs button').forEach(b => b.classList.remove('active-tab', 'bg-white'));
        document.getElementById(tabId).classList.remove('hidden');
        document.getElementById('tab-' + tabId.split('-')[1]).classList.add('active-tab');
    }

    // Переключение вкладок (Админ)
    function switchWorkerTab(tabId) {
        document.querySelectorAll('.worker-tab-content').forEach(c => c.classList.add('hidden'));
        document.querySelectorAll('#worker-tabs button').forEach(b => b.classList.remove('active-tab', 'bg-white'));
        document.getElementById(tabId).classList.remove('hidden');
        document.getElementById('tab-w-' + tabId.split('-')[1]).classList.add('active-tab');
    }

    // Функции кнопок (Админ)
    function openTruckModal() { document.getElementById('truck-modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('truck-modal').classList.add('hidden'); }

    async function confirmSendTruck() {
        const m = document.getElementById('t-model').value;
        const p = document.getElementById('t-plate').value;
        await fetch(`${API_URL}/api/send-truck`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ model: m, plate: p, workerId: currentUser })
        });
        closeModal();
        refreshData();
    }

    async function saveCosts() {
        const f = document.getElementById('w-fuel').value;
        const m = document.getElementById('w-money').value;
        await fetch(`${API_URL}/api/spend-resources`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ fuel: f, money: m, workerId: currentUser })
        });
        alert("Сохранено!");
        refreshData();
    }

    // Функции кнопок (Boss)
    async function acceptWeight() {
        const w = document.getElementById('weight-input').value;
        await fetch(`${API_URL}/api/accept-weight`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ weight: w, workerId: 'M1' })
        });
        refreshData();
    }

    async function addStock() {
        const val = document.getElementById('stock-val').value;
        await fetch(`${API_URL}/api/stock-up`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ amount: val })
        });
        refreshData();
    }

    // Авто-вход при загрузке
    if (currentUser) initApp();
    setInterval(refreshData, 5000);
</script>
</body>
</html>
