<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АГРО-КОНТРОЛЬ PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .btn-gradient { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
    </style>
</head>
<body class="bg-[#F8FAFC] text-[#1E293B] min-h-screen font-sans">

    <div id="header" class="hidden bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-50">
        <span class="font-black text-emerald-600 uppercase tracking-tighter">АГРО-КОНТРОЛЬ</span>
        <div class="flex items-center gap-3">
            <span id="user-badge" class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-1 rounded-md font-bold"></span>
            <button onclick="logout()" class="text-[10px] font-bold text-red-500 border border-red-200 px-3 py-1 rounded-lg hover:bg-red-50">ВЫЙТИ</button>
        </div>
    </div>

    <div id="login-screen" class="flex items-center justify-center min-h-screen p-6">
        <div class="bg-white p-8 rounded-[2.5rem] card-shadow w-full max-w-[400px] text-center border border-gray-100">
            <h1 class="text-[#059669] text-2xl font-black tracking-widest mb-10 uppercase">ВХОД</h1>
            <input id="login-id" type="text" placeholder="Логин (Boss или M1)" class="w-full p-4 mb-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500">
            <input id="login-pass" type="password" placeholder="Пароль" class="w-full p-4 mb-8 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500">
            <button onclick="login()" class="w-full btn-gradient text-white font-bold p-4 rounded-2xl tracking-wide uppercase shadow-lg shadow-emerald-200">Войти</button>
        </div>
    </div>

    <div id="owner-screen" class="hidden max-w-lg mx-auto p-4 space-y-6">
        <div class="bg-white rounded-[2rem] card-shadow p-6 border-t-4 border-purple-600">
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-slate-50 p-4 rounded-2xl">
                    <p class="text-[10px] text-gray-400 font-bold uppercase mb-1">ГСМ</p>
                    <p id="fuel-val" class="text-xl font-black text-emerald-600">... л</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl">
                    <p class="text-[10px] text-gray-400 font-bold uppercase mb-1">Урожай</p>
                    <p id="weight-val" class="text-xl font-black text-blue-600">... кг</p>
                </div>
            </div>
            <button onclick="startCycle()" class="w-full bg-purple-600 text-white p-4 rounded-2xl font-black uppercase text-xs tracking-widest">Запустить техкарту</button>
        </div>

        <div class="bg-white rounded-[2rem] card-shadow p-6">
            <h3 class="font-bold text-[10px] uppercase mb-4 text-gray-400 tracking-widest">🆕 Новый участок</h3>
            <div class="space-y-3">
                <input id="f-name" placeholder="Название поля" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none text-sm">
                <input id="f-culture" placeholder="Культура" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none text-sm">
                <select id="f-worker" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none text-sm">
                    <option value="M1">Алексей (M1)</option>
                    <option value="M2">Иван (M2)</option>
                </select>
                <button onclick="addField()" class="w-full bg-slate-800 text-white p-4 rounded-2xl font-bold uppercase text-[10px] tracking-widest">Закрепить исполнителя</button>
            </div>
        </div>

        <div id="weighing-card" class="hidden bg-white rounded-[2rem] card-shadow border-2 border-blue-500 p-6 animate-pulse">
            <p class="text-blue-600 font-black text-[10px] uppercase mb-4">🚛 Машина на весовой!</p>
            <input id="net-weight" type="number" placeholder="Вес в кг" class="w-full p-4 bg-blue-50 border rounded-2xl mb-4 font-bold">
            <button onclick="acceptWeight()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-bold uppercase text-[10px]">Принять вес</button>
        </div>
        
        <div class="bg-white rounded-[2rem] card-shadow p-6">
             <h3 class="font-bold text-[10px] uppercase mb-4 text-gray-400 tracking-widest">🥇 Рейтинг премии</h3>
             <div id="kpi-table" class="space-y-3 text-sm"></div>
        </div>
    </div>

    <div id="worker-screen" class="hidden max-w-lg mx-auto p-4 space-y-6">
        <div class="bg-white rounded-[2rem] card-shadow p-6 border-t-4 border-emerald-500">
            <div id="task-info" class="bg-emerald-50 p-4 rounded-2xl mb-6 text-emerald-800 text-xs italic font-bold text-center">Ожидание техкарты...</div>
            <div class="space-y-4">
                <input id="fuel-use" type="number" placeholder="Расход ГСМ (литры)" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                <input id="misc-use" type="number" placeholder="Еда / Вода (тенге)" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                <button onclick="finishTask()" class="w-full btn-gradient text-white p-5 rounded-2xl font-black uppercase tracking-widest">Завершить работу</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://agro-server-nuwi.onrender.com';
        let currentUser = localStorage.getItem('agro_user') || '';

        // Список пользователей и паролей
        const users = {
            'Boss': { pass: '12345', role: 'owner', name: 'Владелец' },
            'M1': { pass: '5555', role: 'worker', name: 'Алексей' },
            'M2': { pass: '6666', role: 'worker', name: 'Иван' }
        };

        function login() {
            const id = document.getElementById('login-id').value;
            const pass = document.getElementById('login-pass').value;

            if (users[id] && users[id].pass === pass) {
                currentUser = id;
                localStorage.setItem('agro_user', id);
                showScreen();
            } else {
                alert("Ошибка: Неверный логин или пароль");
            }
        }

        function logout() {
            localStorage.removeItem('agro_user');
            location.reload();
        }

        function showScreen() {
            if (!currentUser) return;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('header').classList.remove('hidden');
            document.getElementById('user-badge').innerText = users[currentUser].name;

            if (users[currentUser].role === 'owner') {
                document.getElementById('owner-screen').classList.remove('hidden');
            } else {
                document.getElementById('worker-screen').classList.remove('hidden');
            }
            refreshData();
        }

        async function refreshData() {
            try {
                const res = await fetch(`${API_URL}/api/state`);
                const state = await res.json();
                
                if(document.getElementById('fuel-val')) {
                    document.getElementById('fuel-val').innerText = state.fuel + ' л';
                    document.getElementById('weight-val').innerText = state.totalWeight + ' кг';
                }

                const tInfo = document.getElementById('task-info');
                if(tInfo) tInfo.innerText = state.activeCycle ? `Задача: ${state.activeCycle.culture}` : "Ожидание техкарты...";

                const weighCard = document.getElementById('weighing-card');
                if(weighCard) state.truckInWay ? weighCard.classList.remove('hidden') : weighCard.classList.add('hidden');

                const kTable = document.getElementById('kpi-table');
                if(kTable) {
                    kTable.innerHTML = Object.entries(state.workers).map(([id, w]) => `
                        <div class="flex justify-between border-b pb-2">
                            <span>${w.name}</span>
                            <span class="font-bold text-emerald-600">+${Math.round(w.bonus)} ₸</span>
                        </div>
                    `).join('');
                }
            } catch (e) { console.log("Связь..."); }
        }

        async function addField() {
            const name = document.getElementById('f-name').value;
            const culture = document.getElementById('f-culture').value;
            const workerId = document.getElementById('f-worker').value;
            if(!name || !culture) return alert("Заполните данные!");

            await fetch(`${API_URL}/api/start-cycle`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ culture: `${culture} (${name})` })
            });
            alert("Участок добавлен, задача отправлена сотруднику!");
            refreshData();
        }

        async function finishTask() {
            const fuel = document.getElementById('fuel-use').value;
            if(!fuel) return alert("Введите ГСМ");
            await fetch(`${API_URL}/api/finish-task`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ fuelSpent: fuel })
            });
            alert("Готово! Машина в пути.");
            refreshData();
        }

        async function acceptWeight() {
            const w = document.getElementById('net-weight').value;
            await fetch(`${API_URL}/api/accept-weight`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ weight: parseFloat(w), workerId: 'M1' })
            });
            refreshData();
        }

        if (currentUser) showScreen();
        setInterval(refreshData, 5000);
    </script>
</body>
</html>
